[package]
name = "agent-control-plane"
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.94"
description = "Local agent control plane with role-scoped workers and human integration gates"
repository = "https://github.com/Vvlladd/acp-core"
readme = "README.md"
publish = false

[[bin]]
name = "acp"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "sync", "time", "net", "signal"] }
tokio-util = { version = "0.7", features = ["codec"] }
rmcp = { version = "3.1", features = ["server", "macros", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
jsonschema = { version = "0.50", default-features = false }
clap = { version = "4", features = ["derive"] }
nix = { version = "0.29", features = ["signal", "process"] }
libc = "0.2"
globset = "0.4"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"

[dev-dependencies]
tempfile = "3"
